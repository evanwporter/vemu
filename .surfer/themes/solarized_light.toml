# Surfer solarized light
# Colors from here https://github.com/ryanolsonx/vscode-solarized-theme/blob/master/themes/solarized-light-color-theme.json
# AI slop

foreground = "657b83"
alt_text_color = "93a1a1"
border_color = "eee8d5"

selected_elements_colors = { 
  background = "eee8d5", 
  alt_background = "e6dfc8",
  foreground = "657b83" 
}

canvas_colors = { 
  background = "fdf6e3", 
  alt_background = "eee8d5",
  foreground = "657b83" 
}

primary_ui_color = { 
  background = "eee8d5", 
  foreground = "657b83" 
}

secondary_ui_color = { 
  background = "f5efdc", 
  foreground = "657b83" 
}

# softer UI accents
accent_info = { background = "e0f2f1", foreground = "2aa198" }
accent_warn = { background = "fdf6d9", foreground = "b58900" }
accent_error = { background = "fdecea", foreground = "dc322f" }

variable_default = "4f6f1f"      # darker green
variable_undef = "a02c2c"        # deeper red
variable_highimp = "1f5f8b"      # deeper blue

variable_dontcare = "7b8b8f"
variable_weak = "9a7d00"
variable_parameter = "1f8a87"
variable_event = "1c6fa3"

transaction_default = "1c6fa3"

waveform_opacity = 0.12
wide_opacity = 0.0

cursor = { color = "d30102", width = 2 }

linewidth = 2
thick_linewidth = 4

highlight_background = "eee8d5"

viewport_separator = { color = "e6dfc8", width = 3 }

drag_hint_color = "93a1a1"
drag_hint_width = 2.0

[colors]
Green = "586e75"
Red = "cb4b16"
Yellow = "a57700"
Blue = "1f5f8b"
Magenta = "b03060"
Cyan = "1f8a87"
Orange = "a14b1f"
Violet = "5a5cad"
Gray = "93a1a1"

[ticks]
style = { color = "e6dfc8", width = 1 }
density = 1