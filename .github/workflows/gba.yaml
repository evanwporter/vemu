name: gba

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - cores/gba/**
      - cores/common/**
      - tests/GameboyAdvanceCPUTests
      - tests/gba-tests
      - CMakeLists.txt
      - CMakePresets.json
      - flake.nix
      - flake.lock
      - .github/workflows/gba.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure
        run: nix develop --command cmake --preset debug --fresh

      - name: Build
        run: nix develop --command cmake --build --preset debug --target test_gba

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: test_gba
          path: build/debug/cores/gba/tests/test_gba

  arm_sst_tests:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: true
      matrix:
        test:
          - data_proc_immediate
          - data_proc_immediate_shift
          - data_proc_register_shift
          - ldm_stm
          - ldr_str_immediate_offset
          - ldr_str_register_offset
          - ldrh_strh
          - ldrsb_ldrsh
          - b_bl
          - bx
          - swi
          - mul_mla
          - mull_mlal
          - swp
          - mrs
          - msr_imm
          - msr_reg

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - uses: actions/download-artifact@v4
        with:
          name: test_gba

      - name: Run GBA tests
        run: |
          chmod +x test_gba
          nix develop --command ./test_gba --gtest_filter='*arm_${{ matrix.test }}_json' --test-dir='${{ github.workspace }}/tests/'

  thumb_sst_tests:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: true
      matrix:
        test:
          - add_sub
          - mov_cmp_add_sub
          - data_proc
          - ldr_pc_rel
          - ldm_stm
          - ldr_str_imm_offset
          - ldr_str_reg_offset
          - ldrsb_strb_reg_offset
          - ldrb_strb_imm_offset
          - ldrsh_ldrsb_reg_offset
          - ldrh_strh_imm_offset
          - ldr_str_sp_rel
          - add_cmp_mov_hi
          - add_sub_sp
          - b
          - bcc
          - bx
          - bl_blx_prefix
          - bl_suffix
          - push_pop

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - uses: actions/download-artifact@v4
        with:
          name: test_gba

      - name: Run GBA tests
        run: |
          chmod +x test_gba
          nix develop --command ./test_gba --gtest_filter='*thumb_${{ matrix.test }}_json' --test-dir='${{ github.workspace }}/tests/'

  jsmolka_gba_tests:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: true
      matrix:
        test:
          - ARM_GBA_Tests
          - Thumb_GBA_Tests

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - uses: actions/download-artifact@v4
        with:
          name: test_gba

      - name: Run GBA tests
        run: |
          chmod +x test_gba
          nix develop --command ./test_gba --gtest_filter='*${{ matrix.test }}*' --test-dir='${{ github.workspace }}/tests/'
